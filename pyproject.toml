[project]
name = "homewizard-smarthome"
version = "0.2.0"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "homeassistant==2026.10.4",
  "pytest-homeassistant-custom-component",
  "pytest-aiohttp",
  "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
# Keep integration syntax importable on Home Assistant's Python 3.13 runtimes.
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
